<!DOCTYPE html>
<html>
<head>
    <title>Subjects</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav>
    <h2>Smart Timetable Optimizer</h2>

    <div>
        <a href="/">Home</a>
        <a href="/teacher">Teachers</a>
        <a href="/subject">Subjects</a>
        <a href="/classroom">Classrooms</a>
        <a href="/class">Classes</a>
    </div>
</nav>

<section class="hero">

<h1>Add Subject</h1>

<form action="/save_subject" method="POST">

    <label>Class</label><br>
    <select name="class_name">
        <option>FY DS</option>
        <option>SY DS</option>
        <option>TY DS</option>
    </select><br><br>

    <label>Subject Name</label><br>
    <input type="text" name="subject_name"><br><br>

    <label>Department</label><br>
    <input type="text" name="department"><br><br>

    <label>Required Periods</label><br>
    <input type="number" name="periods"><br><br>

    <button type="submit">Save Subject</button>

</form>

</section>

</body>
</html>
